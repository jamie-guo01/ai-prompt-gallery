<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptHub · AI 视觉灵感库</title>
    <meta name="description" content="给互联网设计师的 AI 图片提示词灵感库，覆盖运营、APP、海报、插画、IP等设计场景">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
    <!-- Top Navigation -->
    <header class="topbar">
        <a class="brand" href="#">
            <span class="brand-icon">✦</span>
            <span class="brand-name">Jamie建建</span>
        </a>
        <nav class="primary-nav" id="primaryNav" aria-label="一级分类">
            <button type="button" data-view="home" class="active">首页</button>
            <!-- category buttons will be injected by JS -->
            <span class="nav-indicator" id="navIndicator" aria-hidden="true"></span>
        </nav>
        <div class="topbar-actions">
            <button class="topbar-search" id="searchToggle" aria-label="搜索">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.3-4.3"/>
                </svg>
            </button>
            <a class="topbar-link" href="#">联系作者</a>
        </div>
    </header>

    <!-- Layout: sidebar + main -->
    <div class="layout" id="layout" data-view="home">
        <!-- Sidebar (hidden on home, visible on category view) -->
        <aside class="sidebar" id="sidebar" aria-label="二级分类">
            <div class="sub-wrap">
                <ul class="sub-nav" id="subNav">
                    <!-- populated by JS -->
                </ul>
            </div>
        </aside>

        <!-- Main content -->
        <main class="main-content" id="mainContent">
            <div id="grid" aria-live="polite"></div>
        </main>
    </div>

    <!-- Search Overlay -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-modal">
            <div class="search-input-wrapper">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.3-4.3"/>
                </svg>
                <input type="text" placeholder="搜索提示词、风格、场景..." class="search-input" id="searchInput">
                <kbd class="search-kbd">ESC</kbd>
            </div>
            <div class="search-results" id="searchResults">
                <div class="search-hint">输入关键词搜索灵感图片...</div>
            </div>
        </div>
    </div>

    <!-- Image Detail Modal -->
    <div class="detail-modal" id="detailModal">
        <div class="detail-backdrop"></div>
        <div class="detail-content">
            <button class="detail-close" id="detailClose">✕</button>
            <div class="detail-image">
                <img id="detailImg" src="" alt="">
            </div>
            <div class="detail-info">
                <div class="detail-meta-tags">
                    <span class="detail-tag" id="detailCategory"></span>
                    <span class="detail-tag" id="detailStyle"></span>
                </div>
                <h3 class="detail-title" id="detailTitle"></h3>
                <div class="detail-prompt-area">
                    <label class="detail-label">Prompt</label>
                    <div class="detail-prompt" id="detailPrompt"></div>
                    <button class="copy-btn" id="copyBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                        </svg>
                        复制提示词
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Cursor follower -->
    <div class="cursor-follower" id="cursorFollower"></div>

    <script src="script.js"></script>
</body>
</html>
